name: education-app
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-education}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-education}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-local}
      APP_STORAGE_LOCAL_ROOT: /app/data/materials
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
      APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:-}
      APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:-}
      APP_SCAN_ENGINE: ${APP_SCAN_ENGINE:-none}
      APP_SCAN_HOST: ${APP_SCAN_HOST:-clamav}
      APP_SCAN_PORT: ${APP_SCAN_PORT:-3310}
      APP_SCAN_REQUIRED: ${APP_SCAN_REQUIRED:-false}
    volumes:
      - material_data:/app/data/materials
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  frontend:
    profiles: [app]
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
  clamav:
    profiles: [malware]
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    mem_limit: 3g
    restart: unless-stopped
volumes:
  postgres_data:
  material_data:
  clamav_data:
