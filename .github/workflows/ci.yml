name: Verify Education App
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw && ./mvnw -B verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_SCAN_ENGINE: clamav
      APP_SCAN_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r scripts/requirements-browser.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - run: sh scripts/setup.sh
      - run: .venv/bin/python scripts/validate_content.py
      - run: docker compose --profile app --profile malware up -d --build --wait --wait-timeout 300
      - run: .venv/bin/python scripts/browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/phase2_browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/expansion_browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/content_browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/course_content_browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/content_pack_safety_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/test_admin_operator.py
      - run: .venv/bin/python scripts/analytics_browser_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - run: .venv/bin/python scripts/pwa_update_tests.py
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8081
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            docs/screenshots/
            !test-results/**/*fixture*.json
            !test-results/**/*.dump
      - run: docker compose --profile app --profile malware down
        if: always()
